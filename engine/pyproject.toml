[project]
name = "agentic-retrieval"
version = "0.7.0"
description = "Fully offline contextual RAG retrieval experiment"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Wilson Josix Wang" }]
readme = "README.md"
keywords = ["retrieval", "rag", "bm25", "dense-ann", "contextual-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# ZERO required dependencies — the default pipeline is stdlib-only.
dependencies = []

[project.urls]
Homepage = "https://github.com/josix/agentic-retrieval"
Repository = "https://github.com/josix/agentic-retrieval"

[project.scripts]
retrieval = "retrieval.cli:main"

[project.optional-dependencies]
# Local embeddings — no API keys required, GPU optional
local = ["sentence-transformers"]
# Remote providers — require API keys set in environment
remote = ["anthropic", "voyageai", "cohere", "httpx", "requests"]
# Dense ANN comparison retriever (TurboQuant quantization)
turbovec = ["turbovec"]
# Pi-Serini comparison retriever (Lucene BM25 via Pyserini; needs Java 21)
pyserini = ["pyserini"]
# Tree-sitter AST-boundary chunking (structural/code retriever)
# tree-sitter is capped below 0.26: 0.26.0 has a native memory-corruption
# regression that segfaults (SIGSEGV) deterministically when chunk_code()
# parses several real source files sequentially in one process — bisected
# to tree-sitter itself (0.24.0-0.25.2 are all clean; tree-sitter-language-
# pack version is not implicated). See retrieval/ast_chunker.py::chunk_code.
treesitter = ["tree-sitter>=0.24,<0.26", "tree-sitter-language-pack"]
# Every optional retrieval extra in one install (local + remote + turbovec + pyserini + treesitter)
all = ["agentic-retrieval[local,remote,turbovec,pyserini,treesitter]"]
# Dev tooling
dev = ["ruff", "isort", "complexipy"]

[dependency-groups]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[tool.uv]
# macOS 13 (Darwin 22, macosx_13_0_arm64) ships no arm64 wheels for
# torch >= 2.12 or onnxruntime >= 1.24 (those are macosx_14+ only).
# Cap them on Apple Silicon so `uv sync --extra all` resolves to versions
# with macosx_13-compatible arm64 wheels. Scoped to darwin+arm64 so Linux,
# Windows, and macOS x86 keep the newest releases. These are *constraints*,
# not dependencies: they only bound packages already required by the
# local/pyserini/all extras and never touch the stdlib-only core.
constraint-dependencies = [
    "torch>=2.9,<2.12 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnxruntime>=1.23,<1.24 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]
